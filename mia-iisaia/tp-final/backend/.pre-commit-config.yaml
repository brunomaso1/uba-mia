repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff (lint)
        entry: bash -c 'cd mia-iisaia/tp-final/backend && uv run ruff check --fix'
        language: system
        types: [python]
        files: ^mia-iisaia/tp-final/backend/
        pass_filenames: false

      - id: ruff-format
        name: ruff (format)
        entry: bash -c 'cd mia-iisaia/tp-final/backend && uv run ruff format'
        language: system
        types: [python]
        pass_filenames: false
