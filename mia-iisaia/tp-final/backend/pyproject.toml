[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]==0.136.3",
    "fastapi-keycloak-middleware==1.6.0",
    "httpx==0.28.0",
    "psycopg2-binary==2.9.10",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "sqlalchemy==2.0.36",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes (basic correctness)
# I: isort (import sorting)
# UP: pyupgrade (modernize syntax for Python 3.12)
# B: flake8-bugbear (common bugs and design issues)
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI uses Depends() in argument defaults by design
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
