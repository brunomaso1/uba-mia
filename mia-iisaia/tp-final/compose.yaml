name: expense-app

services:
  app_db:
    image: postgres:${POSTGRES_VERSION:-18.4}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expense_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - app_postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-expense_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.6.3}
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KEYCLOAK_POSTGRES_DB:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:-admin}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-password}
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      keycloak_db:
        condition: service_healthy

  keycloak_db:
    image: postgres:${POSTGRES_VERSION:-18.4}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:-keycloak_db}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-password}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_POSTGRES_USER:-admin} -d ${KEYCLOAK_POSTGRES_DB:-keycloak_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        UV_VERSION: ${UV_VERSION:-python3.12-bookworm-slim}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@app_db:5432/${POSTGRES_DB:-expense_db}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: expense-app
      KEYCLOAK_CLIENT_ID: expense-frontend
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:4200"]}'
    ports:
      - "8000:8000"
    depends_on:
      app_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NODE_VERSION: ${NODE_VERSION:-26-alpine}
        NGINX_VERSION: ${NGINX_VERSION:-1.31.1-alpine}
    restart: unless-stopped
    ports:
      - "4200:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app_postgres_data:
  keycloak_postgres_data:
