<main>
  <h1>Runtime config check</h1>
  <p>API URL: {{ apiUrl() }}</p>

  @if (testInfo.isLoading()) {
    <p>Loading backend info…</p>
  } @else if (testInfo.error()) {
    <p role="alert">Could not reach the backend at {{ apiUrl() }}.</p>
  } @else if (testInfo.value(); as info) {
    <h2>Backend says:</h2>
    <pre>{{ info | json }}</pre>
  }
</main>

<router-outlet />
