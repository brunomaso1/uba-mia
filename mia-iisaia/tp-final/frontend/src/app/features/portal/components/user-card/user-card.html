@if (isLoading()) {
  <mat-spinner diameter="32" aria-label="Loading user…" />
} @else if (error()) {
  <p role="alert">Could not load the authenticated user.</p>
} @else if (user(); as userData) {
  <mat-card>
    <mat-card-header>
      <mat-card-title>Authenticated User</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <pre>{{ userData | json }}</pre>
    </mat-card-content>
  </mat-card>
}
